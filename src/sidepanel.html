<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1분에디터</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <div>
          <h1>1분에디터</h1>
          <p class="brand">AcrossEditor</p>
        </div>
        <button type="button" id="settingsBtn" class="icon-btn" aria-label="설정" title="설정">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.22-1.14.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.6 7.6 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.49.4 1.04.72 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.22 1.14-.54 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
          </svg>
        </button>
      </div>
      <p class="lede">이 탭을 위에서 아래까지 한 장으로 저장하고, 새 홈페이지 방향에 맞는 문구를 만듭니다.</p>
      <p id="licenseHint" class="hint">설정에서 라이선스 키와 제미나이 키를 저장해 주세요.</p>
    </header>

    <div id="settingsLayer" class="settings-layer" hidden>
      <button type="button" id="settingsBackdrop" class="settings-backdrop" aria-label="설정 닫기"></button>
      <aside class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-head">
          <h2 id="settingsTitle">설정</h2>
          <button type="button" id="settingsClose" class="settings-close" aria-label="닫기">×</button>
        </div>
        <label>
          라이선스 키
          <input id="license-key" type="text" autocomplete="off" spellcheck="false" placeholder="구매 후 받은 키" />
        </label>
        <label>
          제미나이 키
          <input id="gemini-key" type="password" autocomplete="off" spellcheck="false" placeholder="AI Studio에서 만든 본인 키" />
        </label>
        <label>
          서버 주소
          <input id="server-url" type="url" inputmode="url" spellcheck="false" placeholder="https://acrosseditor.onrender.com" />
        </label>
        <button id="save-settings" class="primary" type="button">설정 저장</button>
        <p class="hint">라이선스 키는 이 크롬에 로그인한 Google 계정에 묶입니다. 제미나이 키는 이 브라우저에만 저장되고, 문구 요금은 그 키의 무료 한도에서 나갑니다.</p>
      </aside>
    </div>

    <button id="capture" class="primary" type="button">전체 페이지 캡처</button>
    <p id="status" class="status" aria-live="polite">참고할 홈페이지 탭을 연 뒤 캡처를 누르세요.</p>

    <section id="preview-section" class="preview" hidden>
      <img id="preview" alt="캡처한 전체 페이지 미리보기" />
      <div class="preview-row">
        <p id="page-meta"></p>
        <button id="download" type="button">이미지 저장</button>
      </div>
    </section>

    <section id="section-picker" class="section-picker" hidden>
      <div class="picker-head">
        <h2>구간 선택</h2>
        <button id="select-all" type="button">모두 선택</button>
      </div>
      <div id="section-list" class="section-list"></div>
    </section>

    <form id="brief">
      <label>
        새 홈페이지 방향
        <textarea id="direction" rows="5" placeholder="예: 20대 여성 의류 쇼핑몰. 데일리 원피스와 봄 자켓. 당일출고와 무료배송을 강조."></textarea>
      </label>
      <label>
        상호
        <input id="business-name" type="text" placeholder="없으면 비워 두세요" />
      </label>
      <label>
        말투
        <select id="tone">
          <option selected>세련된 광고 말투</option>
          <option>고급스럽게</option>
          <option>친근하게</option>
          <option>담백하게</option>
          <option>또렷하고 자신 있게</option>
        </select>
      </label>
      <button id="generate" class="primary" type="submit">문구 만들기</button>
    </form>

    <section id="results" class="results" hidden>
      <div class="results-head">
        <h2>구간별 문구</h2>
        <button id="copy-all" type="button">전체 복사</button>
      </div>
      <nav id="page-nav" class="page-nav" aria-label="구간 페이지" hidden></nav>
      <div id="result-list"></div>
    </section>

    <dialog id="edit-dialog" aria-labelledby="edit-role">
      <div class="dialog-head">
        <p id="edit-role" class="role"></p>
        <button id="edit-close" type="button">닫기</button>
      </div>
      <p class="sheet-caption">원래 문구</p>
      <img id="edit-original" alt="원래 문구" />
      <label class="edit-label">
        수정된 문구
        <textarea id="edit-text" rows="4"></textarea>
      </label>
      <div class="dialog-actions">
        <button id="edit-copy" type="button">복사</button>
        <button id="edit-apply" type="button">수정</button>
        <button id="edit-jump" type="button">이 위치로</button>
      </div>
    </dialog>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
