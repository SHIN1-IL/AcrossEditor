<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>1분에디터 운영 콘솔</title>
  <link rel="stylesheet" href="styles.css?v=20261010n" />
</head>
<body>
  <h1>1분에디터 운영 콘솔</h1>
  <p class="sub">관리자 전용 · 검색에 올리지 마세요</p>

  <section class="card" id="loginCard">
    <form id="loginForm">
      <label for="token">ADMIN_TOKEN</label>
      <div class="row">
        <input type="password" id="token" autocomplete="current-password" placeholder="서버의 ADMIN_TOKEN" />
        <button type="submit">입장</button>
      </div>
    </form>
    <p id="loginErr" class="err" hidden></p>
  </section>

  <div id="desk" hidden>
    <section class="card">
      <h2>라이선스 발급</h2>
      <p class="plan-meta">설치판 · 79,000원 · 1회 · 무기한. 고객은 자기 제미나이 키를 확장에 넣습니다.</p>
      <button type="button" id="issueBtn">설치판 키 발급</button>
      <label>메모 (업체명·전화)</label>
      <input type="text" id="note" placeholder="예: ○○스튜디오 010-..." />
      <p id="issueMsg" class="ok" hidden></p>
      <label>고객 안내 카톡</label>
      <textarea id="customerMsg" rows="10" readonly></textarea>
      <button type="button" id="copyMsgBtn" class="secondary">안내문 복사</button>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>라이선스</h2>
        <div class="list-tools">
          <button type="button" id="refreshBtn" class="secondary">새로고침</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>키</th><th>시작</th><th>상태</th><th>계정</th><th>메모</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="app.js?v=20261010"></script>
</body>
</html>
